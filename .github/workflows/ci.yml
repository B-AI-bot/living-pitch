name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scan changed files for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" -- . ':!package-lock.json' > /tmp/living-pitch.diff
          else
            git diff --unified=0 HEAD^ HEAD -- . ':!package-lock.json' > /tmp/living-pitch.diff
          fi
          if grep -Ein 'sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/living-pitch.diff; then
            echo 'Potential secret found in changed lines.' >&2
            exit 1
          fi
          # The browser project key is public and intentionally lives in the client.
          # Any other phc_ value is treated as a leaked PostHog credential.
          if grep -Ein 'phc_[A-Za-z0-9]{16,}' /tmp/living-pitch.diff | grep -v 'POSTHOG_KEY'; then
            echo 'Unexpected PostHog credential found in changed lines.' >&2
            exit 1
          fi
          needle='to'
          needle="${needle}ken"
          if grep -Ein "$needle[[:space:]]*=" /tmp/living-pitch.diff; then
            echo 'Potential secret found in changed lines.' >&2
            exit 1
          fi
