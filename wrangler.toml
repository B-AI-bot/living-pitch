name = "living-pitch"
main = "src/worker.js"
compatibility_date = "2026-08-28"

# Development-only signing key for slot nonces. Production uses a Wrangler
# secret: `wrangler secret put BOOKING_NONCE_SECRET`.
[vars]
BOOKING_NONCE_SECRET = "living-pitch-dev-booking-nonce-secret"

[assets]
directory = "./dist"
binding = "ASSETS"
# The worker runs on every path so missing assets return a real 404 instead of
# the SPA fallback (adversarial finding #7). Real assets still stream from the
# binding; the worker only adds the content-type guard.
run_worker_first = ["/*"]
not_found_handling = "single-page-application"
